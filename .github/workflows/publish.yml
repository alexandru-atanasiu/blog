name: Publish blog

# Converts the Markdown posts to HTML (dist/), commits dist/ back to main when it changed,
# then deploys exactly that commit's dist/ to GitHub Pages.

on:
  push:
    branches: [main]
    # Everything that affects the generated site. dist/ is deliberately NOT listed: the
    # commit this workflow pushes must never start another run. (Pushes made with
    # GITHUB_TOKEN do not trigger workflows anyway; the path filter is a second guard.)
    paths:
      - 'posts/**'
      - 'pages/**'
      - 'templates/**'
      - 'static/**'
      - 'scripts/**'
      - 'site.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# One publish at a time. A newer run waits for the running one instead of racing it
# (and replaces any older run that is still waiting).
concurrency:
  group: publish-blog
  cancel-in-progress: false

permissions: {}

jobs:
  convert:
    name: convert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          # Always the current tip of main, not the triggering SHA: a queued run may
          # start after main has moved (for example past an earlier run's dist/ commit).
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build and commit dist/
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            npm ci
            npm run build

            git add --all dist
            if git diff --cached --quiet; then
              echo "dist/ is up to date at $(git rev-parse --short HEAD); nothing to commit."
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            source_sha="$(git rev-parse --short HEAD)"
            git commit --quiet -m "Rebuild dist/ for ${source_sha}" -m "Generated by the Publish blog workflow (run ${GITHUB_RUN_ID})."
            if git push origin HEAD:main; then
              echo "Pushed $(git rev-parse --short HEAD) with the rebuilt dist/."
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # main moved while we were building. Drop our commit and rebuild from the new tip,
            # so the published dist/ always matches the sources it is committed with.
            echo "::warning::Push rejected (attempt ${attempt}); main moved. Rebuilding from the new tip."
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
          done

          echo "::error::Could not push dist/ to main after 5 attempts."
          exit 1

  deploy:
    name: deploy
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the converted commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.convert.outputs.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
